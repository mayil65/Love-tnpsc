<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVE TNPSC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40 flex justify-between items-center">
    <h1 class="text-xl font-black text-emerald-400 tracking-wider">LOVE TNPSC</h1>
    <button onclick="openAdmin()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 font-bold">Admin</button>
  </header>

  <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center">
    <!-- 1. Start Screen -->
    <section id="screenStart" class="text-center space-y-6">
      <div class="space-y-2">
        <h2 class="text-2xl font-bold text-slate-100">TNPSC தேர்வுப் பயிற்சி</h2>
        <p class="text-sm text-slate-400">உங்கள் அறிவைச் சோதித்துப் பாருங்கள்!</p>
      </div>
      <button onclick="startQuiz()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl transition">தேர்வைத் தொடங்கு</button>
    </section>

    <!-- 2. Quiz Playing Screen -->
    <section id="screenQuiz" class="hidden space-y-4">
      <div class="flex justify-between items-center text-sm font-semibold text-slate-400">
        <span id="qCountText">வினா 1/1</span>
        <span id="qSubjectTag" class="text-xs bg-slate-800 text-emerald-400 px-2 py-1 rounded">பொது அறிவு</span>
      </div>

      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
        <h3 id="qText" class="text-lg font-medium leading-relaxed">கேள்வி ஏற்றப்படுகிறது...</h3>
        <div id="optionsContainer" class="space-y-2.5"></div>
      </div>

      <div id="explanationCard" class="hidden bg-slate-900/80 border border-slate-800 p-4 rounded-xl text-sm space-y-1">
        <span class="text-emerald-400 font-semibold">விளக்கம்:</span>
        <p id="expText" class="text-slate-300"></p>
      </div>

      <button id="btnNext" onclick="nextQuestion()" class="hidden w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition">அடுத்த வினா</button>
    </section>

    <!-- 3. Result Screen -->
    <section id="screenResult" class="hidden text-center space-y-6">
      <h2 class="text-2xl font-bold text-slate-100">தேர்வு முடிந்தது!</h2>
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-2">
        <p class="text-sm text-slate-400">உங்கள் மதிப்பெண்</p>
        <p id="scoreText" class="text-4xl font-extrabold text-emerald-400">0 / 0</p>
      </div>
      <button onclick="startQuiz()" class="w-full bg-slate-800 hover:bg-slate-700 font-bold py-3 rounded-xl transition">மீண்டும் முயற்சி செய்</button>
    </section>
  </main>

  <!-- Admin Modal -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-slate-100">Admin உள்நுழைவு</h3>
        <button onclick="closeAdmin()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div id="adminAuthSection" class="space-y-3">
        <p class="text-xs text-slate-400">புதிய வினாக்களைச் சேர்க்க கடவுச்சொல்லை உள்ளிடவும்.</p>
        <input type="password" id="adminPassInput" placeholder="கடவுச்சொல் (Password)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none focus:border-emerald-500 text-slate-100">
        <div class="flex gap-2">
          <button onclick="checkAdminPass()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 rounded-lg text-sm">உள்நுழை</button>
          <button onclick="closeAdmin()" class="px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-lg text-sm">ரத்து</button>
        </div>
      </div>

      <div id="adminPanelSection" class="hidden space-y-3">
        <p class="text-xs font-semibold text-emerald-400">புதிய வினா சேர்க்க</p>
        <input id="newSubject" placeholder="பாடம் (எ.கா: பொது அறிவு)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-100">
        <textarea id="newQuestion" placeholder="வினா" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs h-16 text-slate-100"></textarea>
        <input id="opt0" placeholder="விருப்பம் 1" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-100">
        <input id="opt1" placeholder="விருப்பம் 2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-100">
        <input id="opt2" placeholder="விருப்பம் 3" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-100">
        <input id="opt3" placeholder="விருப்பம் 4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-100">
        <select id="correctOpt" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-100">
          <option value="0">விருப்பம் 1 சரி</option>
          <option value="1">விருப்பம் 2 சரி</option>
          <option value="2">விருப்பம் 3 சரி</option>
          <option value="3">விருப்பம் 4 சரி</option>
        </select>
        <textarea id="newExplanation" placeholder="விளக்கம்" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs h-12 text-slate-100"></textarea>
        <button onclick="saveQuestion()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 rounded-lg text-xs">சேமி</button>
      </div>
    </div>
  </div>

  <script>
    const defaultQuestions = [
      {
        subject: "இந்திய ஆட்சியியல்",
        question: "இந்திய அரசியலமைப்பின் 75(4) உறுப்பு எதனைப் பற்றிக் குறிப்பிடுகிறது?",
        options: ["பிரதமரின் நியமனம்", "அமைச்சர்களின் பதவிப் பிரமாணம்", "மக்களவை கலைப்பு", "குடியரசுத் தலைவர் தேர்தல்"],
        answer: 1,
        explanation: "உறுப்பு 75(4)ன் படி குடியரசுத் தலைவர் அமைச்சர்களுக்கு பதவிப் பிரமாணமும் இரகசியக் காப்புப் பிரமாணமும் செய்து வைக்கிறார்."
      }
    ];

    let questions = JSON.parse(localStorage.getItem('tnpsc_questions')) || defaultQuestions;
    let currentIndex = 0;
    let score = 0;
    let selectedAnswer = null;

    function startQuiz() {
      document.getElementById('screenStart').classList.add('hidden');
      document.getElementById('screenResult').classList.add('hidden');
      document.getElementById('screenQuiz').classList.remove('hidden');
      currentIndex = 0;
      score = 0;
      loadQuestion();
    }

    function loadQuestion() {
      selectedAnswer = null;
      document.getElementById('explanationCard').classList.add('hidden');
      document.getElementById('btnNext').classList.add('hidden');
      
      const q = questions[currentIndex];
      document.getElementById('qCountText').textContent = `வினா ${currentIndex + 1}/${questions.length}`;
      document.getElementById('qSubjectTag').textContent = q.subject || "TNPSC";
      document.getElementById('progressBar').style.width = `${((currentIndex) / questions.length) * 100}%`;
      document.getElementById('qText').textContent = q.question;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-800 bg-slate-950 hover:bg-slate-900 transition text-sm flex items-center justify-between";
        btn.textContent = opt;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });
    }

    function selectOption(idx) {
      if (selectedAnswer !== null) return;
      selectedAnswer = idx;
      const q = questions[currentIndex];
      const buttons = document.getElementById('optionsContainer').children;

      if (idx === q.answer) {
        buttons[idx].classList.add('border-emerald-500', 'bg-emerald-950/40', 'text-emerald-300');
        score++;
      } else {
        buttons[idx].classList.add('border-rose-500', 'bg-rose-950/40', 'text-rose-300');
        buttons[q.answer].classList.add('border-emerald-500', 'bg-emerald-950/40', 'text-emerald-300');
      }

      if (q.explanation) {
        document.getElementById('expText').textContent = q.explanation;
        document.getElementById('explanationCard').classList.remove('hidden');
      }

      document.getElementById('btnNext').classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('screenQuiz').classList.add('hidden');
      document.getElementById('screenResult').classList.remove('hidden');
      document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
    }

    function openAdmin() {
      document.getElementById('adminModal').classList.remove('hidden');
      document.getElementById('adminAuthSection').classList.remove('hidden');
      document.getElementById('adminPanelSection').classList.add('hidden');
      document.getElementById('adminPassInput').value = '';
    }

    function closeAdmin() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    function checkAdminPass() {
      const entered = document.getElementById('adminPassInput').value.trim();
      if (entered === "Vrsd8773") {
        document.getElementById('adminAuthSection').classList.add('hidden');
        document.getElementById('adminPanelSection').classList.remove('hidden');
      } else {
        alert("தவறான கடவுச்சொல்!");
      }
    }

    function saveQuestion() {
      const q = document.getElementById('newQuestion').value.trim();
      const s = document.getElementById('newSubject').value.trim();
      const o0 = document.getElementById('opt0').value.trim();
      const o1 = document.getElementById('opt1').value.trim();
      const o2 = document.getElementById('opt2').value.trim();
      const o3 = document.getElementById('opt3').value.trim();
      const ans = parseInt(document.getElementById('correctOpt').value);
      const exp = document.getElementById('newExplanation').value.trim();

      if (!q || !o0 || !o1 || !o2 || !o3) {
        alert("அனைத்து விவரங்களையும் நிரப்பவும்!");
        return;
      }

      questions.push({
        subject: s || "TNPSC",
        question: q,
        options: [o0, o1, o2, o3],
        answer: ans,
        explanation: exp
      });

      localStorage.setItem('tnpsc_questions', JSON.stringify(questions));
      alert("வினா வெற்றிகரமாகச் சேர்க்கப்பட்டது!");
      closeAdmin();
      loadQuestion();
    }
  </script>
</body>
</html>
