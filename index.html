<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOVE TNPSC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-24">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2 cursor-pointer" onclick="backToCategories()">
      <span class="text-xl">🎯</span>
      <h1 class="text-xl font-black text-emerald-400 tracking-wider">LOVE TNPSC</h1>
    </div>
    <button onclick="openAdmin()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3.5 py-1.5 rounded-lg border border-slate-700 text-slate-200 font-bold transition">Admin</button>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center">

    <!-- 1. Category Selection Screen -->
    <section id="screenCategories" class="space-y-4">
      <div class="text-center space-y-1 py-1">
        <h2 class="text-lg font-bold text-slate-100">பாடப்பிரிவைத் தேர்ந்தெடுக்கவும்</h2>
        <p class="text-xs text-slate-400">பயிற்சி செய்ய விரும்பும் பாடத்தைத் தொடுங்கள்</p>
      </div>

      <div class="grid grid-cols-2 gap-3" id="categoryGrid">
        <!-- Cards dynamically injected -->
      </div>
    </section>

    <!-- 2. Quiz Playing Screen -->
    <section id="screenQuiz" class="hidden space-y-4">
      <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
        <button onclick="backToCategories()" class="text-emerald-400 hover:text-emerald-300 flex items-center gap-1 font-bold">
          <i class="fa-solid fa-chevron-left"></i> முகப்பு
        </button>
        <span id="qSubjectTag" class="bg-slate-800 text-emerald-400 border border-slate-700 px-2.5 py-1 rounded-full text-[11px] font-bold"></span>
        <span id="qCountText" class="text-slate-300 font-bold"></span>
      </div>

      <!-- Progress bar -->
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
      </div>

      <!-- Question Card -->
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 shadow-xl">
        <h3 id="qText" class="text-base font-semibold leading-relaxed text-slate-100"></h3>
        <div id="optionsContainer" class="space-y-2.5"></div>
      </div>

      <!-- Explanation Card -->
      <div id="explanationCard" class="hidden bg-slate-900/90 border border-slate-800 p-4 rounded-xl text-xs space-y-1">
        <span class="text-emerald-400 font-bold flex items-center gap-1">
          <i class="fa-solid fa-circle-info"></i> விளக்கம்:
        </span>
        <p id="expText" class="text-slate-300 leading-relaxed"></p>
      </div>

      <!-- Navigation Buttons: Previous & Next -->
      <div class="flex gap-2 pt-2">
        <button id="btnPrev" onclick="prevQuestion()" class="hidden flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2 border border-slate-700">
          <i class="fa-solid fa-arrow-left"></i> முந்தைய வினா
        </button>
        <button id="btnNext" onclick="nextQuestion()" class="hidden flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
          அடுத்த வினா <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </section>

    <!-- 3. Result Screen -->
    <section id="screenResult" class="hidden text-center space-y-6">
      <div class="space-y-2">
        <span class="text-5xl">🏆</span>
        <h2 class="text-2xl font-bold text-slate-100">தேர்வு முடிந்தது!</h2>
        <p id="resultSubject" class="text-sm text-emerald-400 font-semibold"></p>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-2">
        <p class="text-xs text-slate-400">உங்கள் மதிப்பெண்</p>
        <p id="scoreText" class="text-4xl font-black text-emerald-400"></p>
      </div>

      <div class="space-y-2.5">
        <button onclick="restartCategoryQuiz()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg text-sm">மீண்டும் முயற்சி செய்</button>
        <button onclick="backToCategories()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl transition text-sm">மற்ற பாடங்கள்</button>
      </div>
    </section>

  </main>

  <!-- Sticky Bottom Adsterra Banner -->
  <div class="fixed bottom-0 left-0 right-0 z-50 bg-slate-950/95 border-t border-slate-800 py-1 flex flex-col items-center justify-center shadow-2xl backdrop-blur-md min-h-[60px]">
    <span class="text-[8px] text-slate-500 tracking-wider uppercase mb-0.5">Advertisement</span>
    <div class="w-full max-w-[320px] h-[50px] flex items-center justify-center overflow-hidden">
      <script>
        atOptions = {
          'key' : '853486a16277f98252f9b41931818810',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>
      <script src="https://www.highrevenueformat.com/853486a16277f98252f9b41931818810/invoke.js"></script>
    </div>
  </div>

  <!-- Admin Modal -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-slate-100 text-sm">நிர்வாகி பகுதி (Admin Login)</h3>
        <button onclick="closeAdmin()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
      </div>

      <!-- Password Login -->
      <div id="adminAuthSection" class="space-y-3">
        <p class="text-xs text-slate-400">புதிய வினாக்களைச் சேர்க்க கடவுச்சொல்லை உள்ளிடவும்.</p>
        <input type="password" id="adminPassInput" placeholder="கடவுச்சொல் (Password)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm outline-none focus:border-emerald-500 text-slate-100">
        <div class="flex gap-2">
          <button onclick="checkAdminPass()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 rounded-lg text-sm">உள்நுழை</button>
          <button onclick="closeAdmin()" class="px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-lg text-sm">ரத்து</button>
        </div>
      </div>

      <!-- Admin Actions Section -->
      <div id="adminPanelSection" class="hidden space-y-4">
        
        <!-- Toggle Tabs -->
        <div class="flex gap-2 border-b border-slate-800 pb-2">
          <button id="tabBulkBtn" onclick="switchAdminTab('bulk')" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950">Gemini Bulk Import</button>
          <button id="tabSingleBtn" onclick="switchAdminTab('single')" class="flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300">தனி வினா சேர்க்க</button>
        </div>

        <!-- 1. Bulk Import Tab -->
        <div id="bulkImportTab" class="space-y-3">
          <p class="text-[11px] text-slate-400">Gemini கொடுக்கும் JSON Code-ஐ கீழே ஒட்டவும்:</p>
          <textarea id="bulkJsonInput" placeholder='[&#10;  {&#10;    "category": "பொதுத்தமிழ்",&#10;    "question": "வினா...",&#10;    "options": ["A", "B", "C", "D"],&#10;    "answer": 0,&#10;    "explanation": "விளக்கம்..."&#10;  }&#10;]' class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs h-44 text-emerald-300 font-mono outline-none focus:border-emerald-500"></textarea>
          <button onclick="importBulkQuestions()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-lg transition">வினாக்களை ஏற்று (Import Questions)</button>
        </div>

        <!-- 2. Single Question Tab -->
        <div id="singleQuestionTab" class="hidden space-y-3">
          <div>
            <label class="text-[11px] text-slate-300 font-semibold block mb-1">பாடப்பிரிவு (Category):</label>
            <select id="newCategory" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-emerald-400 font-bold outline-none">
              <option value="பொதுத்தமிழ்">பொதுத்தமிழ்</option>
              <option value="இந்திய ஆட்சியியல்">இந்திய ஆட்சியியல் (Polity)</option>
              <option value="இந்திய வரலாறு">இந்திய வரலாறு (History)</option>
              <option value="இந்தியப் பொருளாதாரம்">இந்தியப் பொருளாதாரம் (Economy)</option>
              <option value="தமிழ்நாடு நிர்வாகம்">தமிழ்நாடு நிர்வாகம் (TN Admin - Unit 9)</option>
              <option value="தமிழ்நாடு மரபு & பண்பாடு">தமிழ்நாடு மரபு & பண்பாடு (Unit 8)</option>
              <option value="புவியியல்">புவியியல் (Geography)</option>
              <option value="பொது அறிவியல்">பொது அறிவியல் (Science)</option>
              <option value="கணிதம் & திறனறிவு">கணிதம் & திறனறிவு (Aptitude)</option>
              <option value="நடப்பு நிகழ்வுகள்">நடப்பு நிகழ்வுகள் (Current Affairs)</option>
            </select>
          </div>

          <textarea id="newQuestion" placeholder="வினா" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs h-14 text-slate-100 outline-none"></textarea>
          
          <div class="space-y-1.5">
            <input id="opt0" placeholder="விருப்பம் 1" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-slate-100">
            <input id="opt1" placeholder="விருப்பம் 2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-slate-100">
            <input id="opt2" placeholder="விருப்பம் 3" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-slate-100">
            <input id="opt3" placeholder="விருப்பம் 4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-slate-100">
          </div>

          <select id="correctOpt" class="w-full bg-slate-950 border border-emerald-500/50 rounded-lg p-2 text-xs text-slate-100">
            <option value="0">விருப்பம் 1 சரி</option>
            <option value="1">விருப்பம் 2 சரி</option>
            <option value="2">விருப்பம் 3 சரி</option>
            <option value="3">விருப்பம் 4 சரி</option>
          </select>

          <textarea id="newExplanation" placeholder="விளக்கம்" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs h-10 text-slate-100 outline-none"></textarea>
          <button onclick="saveQuestion()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 rounded-lg text-xs">சேமி</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const categoriesData = [
      { id: "பொதுத்தமிழ்", title: "பொதுத்தமிழ்", icon: "fa-book-open", color: "from-rose-500/20 to-orange-500/20", border: "border-rose-500/40" },
      { id: "இந்திய ஆட்சியியல்", title: "ஆட்சியியல் (Polity)", icon: "fa-landmark", color: "from-blue-500/20 to-cyan-500/20", border: "border-blue-500/40" },
      { id: "இந்திய வரலாறு", title: "வரலாறு (History)", icon: "fa-monument", color: "from-amber-500/20 to-yellow-500/20", border: "border-amber-500/40" },
      { id: "இந்தியப் பொருளாதாரம்", title: "பொருளாதாரம்", icon: "fa-chart-line", color: "from-emerald-500/20 to-teal-500/20", border: "border-emerald-500/40" },
      { id: "தமிழ்நாடு நிர்வாகம்", title: "தமிழக நிர்வாகம் (Unit 9)", icon: "fa-building-columns", color: "from-cyan-500/20 to-blue-500/20", border: "border-cyan-500/40" },
      { id: "தமிழ்நாடு மரபு & பண்பாடு", title: "தமிழக மரபு (Unit 8)", icon: "fa-gopuram", color: "from-red-500/20 to-amber-500/20", border: "border-red-500/40" },
      { id: "புவியியல்", title: "புவியியல்", icon: "fa-earth-asia", color: "from-indigo-500/20 to-purple-500/20", border: "border-indigo-500/40" },
      { id: "பொது அறிவியல்", title: "பொது அறிவியல்", icon: "fa-flask-vial", color: "from-violet-500/20 to-fuchsia-500/20", border: "border-violet-500/40" },
      { id: "கணிதம் & திறனறிவு", title: "கணிதம் & திறனறிவு", icon: "fa-calculator", color: "from-pink-500/20 to-rose-500/20", border: "border-pink-500/40" },
      { id: "நடப்பு நிகழ்வுகள்", title: "நடப்பு நிகழ்வுகள்", icon: "fa-newspaper", color: "from-teal-500/20 to-emerald-500/20", border: "border-teal-500/40" }
    ];

    const sampleQuestions = [
      {
        category: "பொதுத்தமிழ்",
        question: "தேம்பாவணி நூலின் ஆசிரியர் யார்?",
        options: ["வீரமாமுனிவர்", "ஜி.யு.போப்", "உமறுப்புலவர்", "எச்.ஏ.கிருஷ்ணப்பிள்ளை"],
        answer: 0,
        explanation: "தேம்பாவணி வீரமாமுனிவரால் இயற்றப்பட்டது."
      },
      {
        category: "இந்திய ஆட்சியியல்",
        question: "இந்திய அரசியலமைப்பின் 75(4) உறுப்பு எதனைப் பற்றிக் குறிப்பிடுகிறது?",
        options: ["பிரதமரின் நியமனம்", "அமைச்சர்களின் பதவிப் பிரமாணம்", "மக்களவை கலைப்பு", "குடியரசுத் தலைவர் தேர்தல்"],
        answer: 1,
        explanation: "உறுப்பு 75(4)ன் படி குடியரசுத் தலைவர் அமைச்சர்களுக்கு பதவிப் பிரமாணமும் இரகசியக் காப்புப் பிரமாணமும் செய்து வைக்கிறார்."
      }
    ];

    let savedData = localStorage.getItem('love_tnpsc_v5');
    let questions = savedData ? JSON.parse(savedData) : sampleQuestions;
    if (!savedData) {
      localStorage.setItem('love_tnpsc_v5', JSON.stringify(questions));
    }

    let currentCategory = "";
    let activeQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};

    function renderCategories() {
      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = '';

      categoriesData.forEach(cat => {
        const count = questions.filter(q => q.category === cat.id).length;
        const card = document.createElement('div');
        card.className = `p-4 rounded-2xl bg-gradient-to-br ${cat.color} border ${cat.border} flex flex-col justify-between cursor-pointer active:scale-95 transition shadow-lg min-h-[110px]`;
        card.onclick = () => startCategoryQuiz(cat.id);
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <span class="text-xl text-slate-100"><i class="fa-solid ${cat.icon}"></i></span>
            <span class="text-[10px] bg-slate-900/90 px-2 py-0.5 rounded-full text-slate-300 font-bold border border-slate-800">${count} வினாக்கள்</span>
          </div>
          <h3 class="font-bold text-xs sm:text-sm text-slate-100">${cat.title}</h3>
        `;
        grid.appendChild(card);
      });
    }

    function startCategoryQuiz(catId) {
      currentCategory = catId;
      activeQuestions = questions.filter(q => q.category === catId);

      if (activeQuestions.length === 0) {
        alert("இந்தப் பாடப்பிரிவில் வினாக்கள் இல்லை! Admin பகுதியில் Gemini Code-ஐ Import செய்யவும்.");
        return;
      }

      document.getElementById('screenCategories').classList.add('hidden');
      document.getElementById('screenResult').classList.add('hidden');
      document.getElementById('screenQuiz').classList.remove('hidden');

      currentIndex = 0;
      userAnswers = {};
      loadQuestion();
    }

    function restartCategoryQuiz() {
      startCategoryQuiz(currentCategory);
    }

    function backToCategories() {
      document.getElementById('screenQuiz').classList.add('hidden');
      document.getElementById('screenResult').classList.add('hidden');
      document.getElementById('screenCategories').classList.remove('hidden');
      renderCategories();
    }

    function loadQuestion() {
      const q = activeQuestions[currentIndex];
      document.getElementById('qSubjectTag').textContent = q.category;
      document.getElementById('qCountText').textContent = `வினா ${currentIndex + 1}/${activeQuestions.length}`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / activeQuestions.length) * 100}%`;
      document.getElementById('qText').textContent = q.question;

      const btnPrev = document.getElementById('btnPrev');
      if (currentIndex > 0) {
        btnPrev.classList.remove('hidden');
      } else {
        btnPrev.classList.add('hidden');
      }

      const btnNext = document.getElementById('btnNext');
      if (currentIndex === activeQuestions.length - 1) {
        btnNext.innerHTML = `முடிவுகளைக் காண்க <i class="fa-solid fa-trophy"></i>`;
      } else {
        btnNext.innerHTML = `அடுத்த வினா <i class="fa-solid fa-arrow-right"></i>`;
      }

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const isAnswered = userAnswers[currentIndex] !== undefined;
      const selectedIdx = userAnswers[currentIndex];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-800 bg-slate-950 transition text-xs sm:text-sm text-slate-200 flex items-center justify-between";
        btn.textContent = opt;

        if (isAnswered) {
          if (idx === q.answer) {
            btn.classList.add('border-emerald-500', 'bg-emerald-950/50', 'text-emerald-300', 'font-bold');
          } else if (idx === selectedIdx) {
            btn.classList.add('border-rose-500', 'bg-rose-950/50', 'text-rose-300');
          }
        } else {
          btn.classList.add('hover:bg-slate-900');
          btn.onclick = () => selectOption(idx);
        }

        container.appendChild(btn);
      });

      const expCard = document.getElementById('explanationCard');
      if (isAnswered) {
        if (q.explanation) {
          document.getElementById('expText').textContent = q.explanation;
          expCard.classList.remove('hidden');
        } else {
          expCard.classList.add('hidden');
        }
        btnNext.classList.remove('hidden');
      } else {
        expCard.classList.add('hidden');
        btnNext.classList.add('hidden');
      }
    }

    function selectOption(idx) {
      if (userAnswers[currentIndex] !== undefined) return;
      userAnswers[currentIndex] = idx;

      const q = activeQuestions[currentIndex];
      const buttons = document.getElementById('optionsContainer').children;

      if (idx === q.answer) {
        buttons[idx].classList.add('border-emerald-500', 'bg-emerald-950/50', 'text-emerald-300', 'font-bold');
      } else {
        buttons[idx].classList.add('border-rose-500', 'bg-rose-950/50', 'text-rose-300');
        buttons[q.answer].classList.add('border-emerald-500', 'bg-emerald-950/50', 'text-emerald-300', 'font-bold');
      }

      for (let btn of buttons) {
        btn.onclick = null;
        btn.classList.remove('hover:bg-slate-900');
      }

      if (q.explanation) {
        document.getElementById('expText').textContent = q.explanation;
        document.getElementById('explanationCard').classList.remove('hidden');
      }

      document.getElementById('btnNext').classList.remove('hidden');
    }

    function nextQuestion() {
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        loadQuestion();
      } else {
        showResults();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
      }
    }

    function showResults() {
      let finalScore = 0;
      activeQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) {
          finalScore++;
        }
      });

      document.getElementById('screenQuiz').classList.add('hidden');
      document.getElementById('screenResult').classList.remove('hidden');
      document.getElementById('resultSubject').textContent = currentCategory;
      document.getElementById('scoreText').textContent = `${finalScore} / ${activeQuestions.length}`;
    }

    // Admin Functions
    function openAdmin() {
      document.getElementById('adminModal').classList.remove('hidden');
      document.getElementById('adminAuthSection').classList.remove('hidden');
      document.getElementById('adminPanelSection').classList.add('hidden');
      document.getElementById('adminPassInput').value = '';
    }

    function closeAdmin() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    function checkAdminPass() {
      const entered = document.getElementById('adminPassInput').value.trim();
      if (entered === "Vrsd8773") {
        document.getElementById('adminAuthSection').classList.add('hidden');
        document.getElementById('adminPanelSection').classList.remove('hidden');
      } else {
        alert("தவறான கடவுச்சொல்!");
      }
    }

    function switchAdminTab(tab) {
      if (tab === 'bulk') {
        document.getElementById('bulkImportTab').classList.remove('hidden');
        document.getElementById('singleQuestionTab').classList.add('hidden');
        document.getElementById('tabBulkBtn').className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950";
        document.getElementById('tabSingleBtn').className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300";
      } else {
        document.getElementById('bulkImportTab').classList.add('hidden');
        document.getElementById('singleQuestionTab').classList.remove('hidden');
        document.getElementById('tabSingleBtn').className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950";
        document.getElementById('tabBulkBtn').className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300";
      }
    }

    function importBulkQuestions() {
      const rawText = document.getElementById('bulkJsonInput').value.trim();
      if (!rawText) {
        alert("குறியீட்டை (Code) உள்ளிடவும்!");
        return;
      }

      try {
        const parsed = JSON.parse(rawText);
        if (!Array.isArray(parsed)) {
          alert("தவறான குறியீடு! இது ஒரு Array [...] ஆக இருக்க வேண்டும்.");
          return;
        }

        questions.push(...parsed);
        localStorage.setItem('love_tnpsc_v5', JSON.stringify(questions));

        alert(`அற்புதம்! ${parsed.length} வினாக்கள் வெற்றிகரமாக சேர்க்கப்பட்டன!`);
        document.getElementById('bulkJsonInput').value = '';
        closeAdmin();
        renderCategories();
      } catch (e) {
        alert("குறியீட்டில் பிழை உள்ளது! Gemini கொடுத்த Code-ஐ முழுமையாக நகலெடுத்து ஒட்டவும்.");
      }
    }

    function saveQuestion() {
      const cat = document.getElementById('newCategory').value;
      const q = document.getElementById('newQuestion').value.trim();
      const o0 = document.getElementById('opt0').value.trim();
      const o1 = document.getElementById('opt1').value.trim();
      const o2 = document.getElementById('opt2').value.trim();
      const o3 = document.getElementById('opt3').value.trim();
      const ans = parseInt(document.getElementById('correctOpt').value);
      const exp = document.getElementById('newExplanation').value.trim();

      if (!q || !o0 || !o1 || !o2 || !o3) {
        alert("அனைத்து விவரங்களையும் பூர்த்தி செய்யவும்!");
        return;
      }

      questions.push({
        category: cat,
        question: q,
        options: [o0, o1, o2, o3],
        answer: ans,
        explanation: exp
      });

      localStorage.setItem('love_tnpsc_v5', JSON.stringify(questions));
      alert(`${cat} பாடப்பிரிவில் வினா சேர்க்கப்பட்டது!`);

      document.getElementById('newQuestion').value = '';
      document.getElementById('opt0').value = '';
      document.getElementById('opt1').value = '';
      document.getElementById('opt2').value = '';
      document.getElementById('opt3').value = '';
      document.getElementById('newExplanation').value = '';

      closeAdmin();
      renderCategories();
    }

    renderCategories();
  </script>
</body>
</html>
